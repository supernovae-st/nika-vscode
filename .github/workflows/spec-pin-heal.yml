name: spec-pin-heal

# The pin follows the ENGINE's judged spec pin: daily, if the SPEC_PIN of
# supernovae-st/nika at this repo's ENGINE_PIN moved past our SPEC_PIN,
# re-project every generated surface at that rev and open ONE idempotent
# PR — this repo's full gate (tests · parity · projector checks at the
# new pin) judges. Never spec HEAD (2026-08-18: one frozen spec identity
# per train — the engine's conformance suites judge it, the pack is
# vendored from it, and our surfaces project from the same commit).
# Never a direct push: generated TS feeds the shipped extension.
# SECURITY: no github.event data.

on:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: The pin follows the spec
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The candidate is the ENGINE's judged pin (supernovae-st/nika
          # SPEC_PIN at ENGINE_PIN), never spec HEAD: one frozen spec
          # identity per train — the engine's conformance suites judged
          # it, the pack was vendored from it, and this extension's
          # generated surfaces project from the same commit (2026-08-18).
          engine="$(grep -v '^#' ENGINE_PIN | head -1 | tr -d '[:space:]')"
          head="$(curl -fsSL "https://raw.githubusercontent.com/supernovae-st/nika/${engine}/SPEC_PIN" | grep -v '^#' | head -1 | tr -d '[:space:]')"
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the engine's SPEC_PIN at ${engine} is not a commit sha"; exit 1; }
          git clone --filter=blob:none https://github.com/supernovae-st/nika-spec ../spec
          git -C ../spec checkout --detach "$head"
          pin="$(grep -v '^#' SPEC_PIN | head -1 | tr -d '[:space:]')"
          if [ "$head" = "$pin" ]; then echo "pin current ($pin) — nothing to heal"; exit 0; fi
          if grep -q '^# HOLD:' SPEC_PIN; then echo "pin HELD (see SPEC_PIN) — deliberate, not drift"; exit 0; fi
          pip install pyyaml jsonschema >/dev/null
          export NIKA_VSCODE_SRC="$GITHUB_WORKSPACE/src"
          python3 ../spec/scripts/starters-projector.py --write
          python3 ../spec/scripts/authoring-projector.py --write
          python3 ../spec/scripts/design-projector.py --write || true # absent legs skip
          python3 - "$head" <<'PYEOF'
          import io, re, sys
          s = io.open('SPEC_PIN', encoding='utf-8').read()
          s = re.sub(r'^[0-9a-f]{40}$', sys.argv[1], s, count=1, flags=re.M)
          io.open('SPEC_PIN', 'w', encoding='utf-8').write(s)
          PYEOF
          git add -A
          git config user.name "nika-release[bot]"
          git config user.email "nika@supernovae.studio"
          git checkout -B bot/spec-pin
          git commit -m "chore(spec-pin): the generated surfaces follow the spec — $(git -C ../spec rev-parse --short HEAD)"
          git push -f origin bot/spec-pin
          gh pr create --head bot/spec-pin \
            --title "chore(spec-pin): the generated surfaces follow the spec" \
            --body "Automated pin advance + re-projection (spec-pin-heal). The full gate judges at the new pin; merge on green." \
            2>/dev/null || echo "PR already open — refreshed"
