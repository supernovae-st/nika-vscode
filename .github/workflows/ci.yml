name: ci

# The PR gate the extension lacked: release.yml packages on tag, but
# nothing checked a PR — a type error or a manifest/source parity drift
# reached main unguarded. Mirrors the repo's own `npm test` contract.
# No user-controlled input reaches the shell.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ownership-model:
    name: ownership model · safety + two negative controls
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fetch the pinned TLA+ tool
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --max-time 120 --retry 2 --max-filesize 16777216 \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            --output "$RUNNER_TEMP/tla2tools.jar"
      - name: Complete exploration and named mutant counterexamples
        env:
          TLC_JAR: ${{ runner.temp }}/tla2tools.jar
        run: node scripts/check-run-ownership-model.mjs

  # The rendered surface, judged by machine. Nine lenses (clip · target ·
  # contrast · spill · motion · occluded · glyph · collide · truncated)
  # across four skins and three widths, plus the i18n shape corpus and
  # forced-colors, plus 45 a11y journeys. These proved every visual
  # claim in DESIGN.md for months while running nowhere but a laptop:
  # a proof nobody re-runs is a memory, not a gate. Headless was
  # qualified by mutation against the headed reference, not assumed.
  probes:
    name: probes · 9 lenses × 4 skins × 3 widths + shape + forced + a11y
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # playwright is deliberately NOT a package dependency (it would ride
      # every npm ci in every job, and the extension never needs it), so
      # the probe job installs it for itself. --no-save keeps the
      # manifest honest.
      - name: Playwright + Chrome for the probes (probe-only, never a dep)
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium chrome
      - name: Compile (the probes load out/webview/*)
        run: npm run compile
      - name: The full sweep
        run: npm run probes

  gate:
    name: typecheck · tests · parity · lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile (typecheck both passes + esbuild — parity needs out/)
        run: npm run compile
      - name: Tests + parity + lint (the repo's own contract)
        run: npm test
      # The SSOT loops, closed consumer-side (the docs-oracle pattern):
      # every *.generated.ts must be byte-exactly what the spec's
      # projectors emit from their YAML SSOTs — a hand edit here, or a
      # spec that moved without a resync, reds this PR instead of
      # drifting silently. The projectors also re-prove every starter
      # and authoring shape against the conformance oracle first.
      # SECURITY: no github.event data is interpolated — the only
      # expression is the runner-controlled workspace path.
      - name: Fetch the spec SSOT at the PIN (sibling layout)
        # SPEC_PIN, never a floating HEAD: a spec merge must not red
        # unrelated PRs here. The spec-pin-heal advances the pin daily
        # through an idempotent PR these same gates judge.
        run: |
          git clone --filter=blob:none https://github.com/supernovae-st/nika-spec ../spec
          pin="$(grep -v '^#' SPEC_PIN | head -1 | tr -d '[:space:]')"
          git -C ../spec checkout --quiet "$pin"
          echo "spec pinned at $pin"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Generated surfaces track the spec projectors
        # starters (verbStarters.generated.ts · oracle re-proof + byte diff)
        # AND authoring shapes (authoringShapes.generated.ts — schema +
        # armor registers, same oracle law) AND design tokens
        # (design-tokens.generated.ts — tokens-parity.mjs only guards
        # INTERNAL coherence). Absent siblings (website · docs) skip.
        env:
          NIKA_VSCODE_SRC: ${{ github.workspace }}/src
        run: |
          pip install pyyaml jsonschema
          python3 ../spec/scripts/starters-projector.py --check
          python3 ../spec/scripts/authoring-projector.py --check
          python3 ../spec/scripts/design-projector.py --check
  # The real-engine belt (design wave 2026-08-01): the contract suite's
  # describe.skipIf(!BIN) silently skipped in CI forever — a binary
  # regression could only be caught on a dev machine. This job obtains
  # the engine at ENGINE_PIN — the extension is a NEXT consumer (2026-08-18
  # · the reader speaks graph_format 3 and the 0.109 envelope, which the
  # newest published tag does not): a pin that is a commit sha is BUILT
  # from source (cached by sha), a pin that is a release tag is DOWNLOADED
  # (the same asset a user installs, checksum-verified). Never « latest
  # release »: that is the stable train, and a suite judged against it
  # would be red for the language the extension teaches. It cannot skip
  # silently: if the binary is missing the belt FAILS loud.
  real-engine-belt:
    name: engine contract · the pinned next engine
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve the engine pin
        id: pin
        run: |
          set -euo pipefail
          pin="$(grep -v '^#' ENGINE_PIN | head -1 | tr -d '[:space:]')"
          [ -n "$pin" ] || { echo "ENGINE_PIN is empty"; exit 1; }
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
          if [[ "$pin" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then echo "mode=release" >> "$GITHUB_OUTPUT"; else echo "mode=source" >> "$GITHUB_OUTPUT"; fi
      - name: Download the pinned released engine (checksum-verified)
        if: steps.pin.outputs.mode == 'release'
        run: |
          set -euo pipefail
          tag="${{ steps.pin.outputs.pin }}"
          ver="${tag#v}"
          curl -fsSLO "https://github.com/supernovae-st/nika/releases/download/${tag}/nika-linux-x64-${ver}.tar.gz"
          curl -fsSLO "https://github.com/supernovae-st/nika/releases/download/${tag}/SHA256SUMS"
          grep "nika-linux-x64-${ver}.tar.gz" SHA256SUMS | sha256sum -c -
          tar -xzf "nika-linux-x64-${ver}.tar.gz"
          bin="$(find . -maxdepth 2 -name nika -type f | head -1)"
          [ -n "$bin" ] || { echo "no nika binary in the tarball"; exit 1; }
          chmod +x "$bin"
          echo "NIKA_BIN=$(realpath "$bin")" >> "$GITHUB_ENV"
      - name: Checkout the pinned engine source
        if: steps.pin.outputs.mode == 'source'
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/supernovae-st/nika "$GITHUB_WORKSPACE/../engine"
          git -C "$GITHUB_WORKSPACE/../engine" checkout --detach "${{ steps.pin.outputs.pin }}"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # master
        if: steps.pin.outputs.mode == 'source'
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        if: steps.pin.outputs.mode == 'source'
        with:
          workspaces: ../engine
          shared-key: engine-${{ steps.pin.outputs.pin }}
      - name: Build the pinned engine (release · locked)
        if: steps.pin.outputs.mode == 'source'
        run: |
          set -euo pipefail
          cargo build --release --locked -p nika-cli --bin nika --manifest-path "$GITHUB_WORKSPACE/../engine/Cargo.toml"
          bin="$GITHUB_WORKSPACE/../engine/target/release/nika"
          [ -x "$bin" ] || { echo "no nika built"; exit 1; }
          echo "NIKA_BIN=$bin" >> "$GITHUB_ENV"
      # The 0.109 engine REFUSES a permits-declaring workflow with exec
      # children when the host cannot jail them (NIKA_SANDBOX=auto · the
      # #889 fail-closed policy) — on a Linux runner without bubblewrap the
      # journey suites' runs never start (measured 2026-08-18: 3 journey
      # tests red with « expected 0 to be greater than 0 » events). Install
      # the jail the same way the engine's own tests leg does, AppArmor
      # detour included, so the runs run.
      - name: Install bubblewrap (the exec jail the next engine requires)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict 2>/dev/null || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Belt must be armed (the silent-skip class dies here)
        run: |
          [ -n "${NIKA_BIN:-}" ] && [ -x "$NIKA_BIN" ] || { echo "belt unarmed — NIKA_BIN missing"; exit 1; }
          "$NIKA_BIN" --version
      - name: Real-binary contract suites
        # contract (the seam · every template the extension writes) ·
        # journey · semanticDocument · the canary polarity (the engine
        # accepts the nine-key canary AND refuses the dead envelope) ·
        # the dead envelope keys (one refusal per retired key).
        run: npx vitest run src/test/contract.test.ts src/test/journeyReal.e2e.test.ts src/test/semanticDocReal.e2e.test.ts src/test/grammarCanary.test.ts src/test/deadEnvelopeReal.e2e.test.ts
      # The release gate's first-contact e2e used to run only at tag time
      # and went red there twice (2026-09-01 · runs 33570485552 and
      # 33575188330) while every PR was green: a fossil gate whose twin
      # never fired on a push. The belt runs the same e2e here, on the same
      # Linux runner, the same jail and the same pinned released engine, so
      # a red first contact is a red PR, never a red tag.
      # The real-binary contract suites above leave engine state in the
      # runner's HOME, and the first contact that follows then lands a
      # different file (measured 2026-09-02 · run 33577484194 · « the
      # landed file is THE demo workflow »). The suite's premise is a virgin
      # machine: give the twin a fresh HOME, as the release gate has one.
      - name: Real VS Code hosts (the release gate's twin · both suites, same order · fresh HOME)
        if: steps.pin.outputs.mode == 'release'
        env:
          HOME: ${{ runner.temp }}/virgin-home
        run: |
          mkdir -p "$HOME"
          xvfb-run -a npm run test:integration
