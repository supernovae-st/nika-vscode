<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Findings appear as you type: the conformance oracle squiggles a tasks.* read outside with:, names NIKA-VAR-021, and the quick fix hoists it">
  <!-- Theme-aware by construction (the install-engine.svg law): every
       color is a var(--vscode-*) token with a dark-safe fallback — an
       authored poster never rots the way a screenshot does (the dead
       depends_on PNG this replaces was flagged by its own oracle). -->
  <style>
    .ui      { font-family: var(--vscode-font-family, system-ui, sans-serif); fill: var(--vscode-foreground, #ccc); }
    .dim     { font-family: var(--vscode-font-family, system-ui, sans-serif); fill: var(--vscode-descriptionForeground, #999); }
    .code    { font-family: var(--vscode-editor-font-family, 'SF Mono', Menlo, Consolas, monospace); fill: var(--vscode-foreground, #ccc); }
    .codedim { font-family: var(--vscode-editor-font-family, 'SF Mono', Menlo, Consolas, monospace); fill: var(--vscode-descriptionForeground, #999); }
    .key     { font-family: var(--vscode-editor-font-family, 'SF Mono', Menlo, Consolas, monospace); fill: var(--vscode-textLink-foreground, #4daafc); }
    .str     { font-family: var(--vscode-editor-font-family, 'SF Mono', Menlo, Consolas, monospace); fill: var(--vscode-charts-orange, #ce9178); }
    .err     { font-family: var(--vscode-editor-font-family, 'SF Mono', Menlo, Consolas, monospace); fill: var(--vscode-errorForeground, #f48771); }
    .accent  { fill: var(--vscode-textLink-foreground, #4daafc); }
    .box     { fill: none; stroke: var(--vscode-foreground, #ccc); stroke-opacity: 0.28; }
    .panel   { fill: var(--vscode-foreground, #ccc); fill-opacity: 0.04; stroke: var(--vscode-foreground, #ccc); stroke-opacity: 0.18; }
    .squig   { stroke: var(--vscode-errorForeground, #f48771); fill: none; stroke-width: 1.4; }
    .bulb    { fill: var(--vscode-charts-yellow, #ffcc02); }
  </style>

  <!-- Editor frame -->
  <rect class="box" x="24" y="20" width="560" height="300" rx="8"/>
  <rect class="box" x="24" y="20" width="560" height="26" rx="8"/>
  <circle cx="40" cy="33" r="4" fill="var(--vscode-descriptionForeground, #999)" fill-opacity="0.5"/>
  <circle cx="54" cy="33" r="4" fill="var(--vscode-descriptionForeground, #999)" fill-opacity="0.35"/>
  <text class="dim" x="72" y="37" font-size="12">review.nika.yaml</text>

  <!-- YAML (current grammar: with: is the edge · no dead forms) -->
  <text class="codedim" x="44" y="70" font-size="13">1</text>
  <text class="code" x="70" y="70" font-size="13"><tspan class="key">nika</tspan>: v1</text>
  <text class="codedim" x="44" y="90" font-size="13">2</text>
  <text class="code" x="70" y="90" font-size="13"><tspan class="key">name</tspan>: review</text>
  <text class="codedim" x="44" y="110" font-size="13">3</text>
  <text class="codedim" x="44" y="130" font-size="13">4</text>
  <text class="code" x="70" y="130" font-size="13"><tspan class="key">tasks</tspan>:</text>
  <text class="codedim" x="44" y="150" font-size="13">5</text>
  <text class="code" x="86" y="150" font-size="13"><tspan class="key">fetch</tspan>:</text>
  <text class="codedim" x="44" y="170" font-size="13">6</text>
  <text class="code" x="102" y="170" font-size="13"><tspan class="key">exec</tspan>: { <tspan class="key">command</tspan>: [<tspan class="str">"git"</tspan>, <tspan class="str">"diff"</tspan>, <tspan class="str">"--stat"</tspan>] }</text>
  <text class="codedim" x="44" y="190" font-size="13">7</text>
  <text class="codedim" x="44" y="210" font-size="13">8</text>
  <text class="code" x="86" y="210" font-size="13"><tspan class="key">assess</tspan>:</text>
  <text class="codedim" x="44" y="230" font-size="13">9</text>
  <text class="code" x="102" y="230" font-size="13"><tspan class="key">infer</tspan>:</text>
  <text class="codedim" x="40" y="250" font-size="13">10</text>
  <text class="code" x="118" y="250" font-size="13"><tspan class="key">model</tspan>: ollama/llama3.2</text>
  <text class="codedim" x="40" y="270" font-size="13">11</text>
  <text class="code" x="118" y="270" font-size="13"><tspan class="key">prompt</tspan>: <tspan class="str">"Review: </tspan><tspan class="err">${{ tasks.fetch.output }}</tspan><tspan class="str">"</tspan></text>
  <!-- the squiggle under the tasks.* read -->
  <path class="squig" d="M195 276 q4 4 8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0"/>
  <!-- quick-fix bulb -->
  <circle class="bulb" cx="106" cy="266" r="6" fill-opacity="0.9"/>
  <text x="103" y="270" font-size="9" fill="var(--vscode-editor-background, #1e1e1e)">!</text>

  <!-- Audit margin (the static cost lens) -->
  <text class="dim" x="470" y="250" font-size="11">local · $0</text>
  <text class="dim" x="470" y="270" font-size="11">1 wave</text>

  <!-- Problems panel -->
  <rect class="panel" x="24" y="336" width="560" height="88" rx="8"/>
  <text class="dim" x="40" y="358" font-size="11">PROBLEMS · 1</text>
  <circle cx="48" cy="378" r="5" fill="var(--vscode-errorForeground, #f48771)"/>
  <text class="ui" x="62" y="382" font-size="12">a tasks.* reference outside the boundary — hoist it into with:</text>
  <text class="codedim" x="62" y="402" font-size="11">NIKA-VAR-021 · review.nika.yaml [11, 18] · quick fix: hoist into with:</text>

  <!-- The oracle chip -->
  <rect class="chip" x="620" y="150" width="156" height="72" rx="10" fill="var(--vscode-textLink-foreground, #4daafc)" fill-opacity="0.10" stroke="var(--vscode-textLink-foreground, #4daafc)" stroke-opacity="0.55"/>
  <text class="code" x="644" y="180" font-size="14">nika check</text>
  <text class="dim" x="644" y="200" font-size="11">the same oracle CI runs</text>
  <line x1="584" y1="186" x2="620" y2="186" stroke="var(--vscode-descriptionForeground, #999)" stroke-opacity="0.7" stroke-width="1.5"/>
  <text class="dim" x="640" y="250" font-size="11">as you type · no run,</text>
  <text class="dim" x="640" y="266" font-size="11">no keys, no network</text>
</svg>
