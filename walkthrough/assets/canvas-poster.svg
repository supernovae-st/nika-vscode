<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The live canvas: the plan as a graph — typed edges (a with: binding is a data edge, an after: entry a control edge), run state on every card, five lenses one key each">
  <!-- Authored poster (the anti-rot law): the canvas skin is the BRAND
       register (pinned dark · DESIGN.md §4), so the viewport speaks the
       real SSOT values — verb hues from design-tokens.generated.ts,
       pool #0d0d0e, raised cards #1c1d21, white hairlines. Caption ink
       outside the viewport stays theme-aware. -->
  <style>
    .cap  { font-family: var(--vscode-font-family, system-ui, sans-serif); fill: var(--vscode-descriptionForeground, #999); }
    .mono { font-family: var(--vscode-editor-font-family, 'SF Mono', Menlo, Consolas, monospace); }
  </style>

  <!-- The pool -->
  <rect x="24" y="20" width="752" height="380" rx="10" fill="#0d0d0e"/>
  <rect x="24" y="20" width="752" height="380" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
  <!-- survey crosses -->
  <g stroke="#ffffff" stroke-opacity="0.055" stroke-width="1">
    <path d="M120 96 h8 M124 92 v8"/><path d="M320 76 h8 M324 72 v8"/><path d="M560 110 h8 M564 106 v8"/>
    <path d="M200 330 h8 M204 326 v8"/><path d="M480 356 h8 M484 352 v8"/><path d="M680 300 h8 M684 296 v8"/>
    <path d="M96 220 h8 M100 216 v8"/><path d="M700 180 h8 M704 176 v8"/>
  </g>

  <!-- title pill -->
  <rect x="44" y="38" width="176" height="28" rx="14" fill="#1c1d21" stroke="#ffffff" stroke-opacity="0.09"/>
  <text class="mono" x="60" y="56" font-size="12" fill="#ccc">review.nika.yaml</text>

  <!-- ═ wires under the cards ═ -->
  <!-- data edge (the binding IS the edge) fetch → assess -->
  <path d="M258 152 C 300 152, 310 196, 352 196" fill="none" stroke="#5b8cff" stroke-opacity="0.85" stroke-width="1.6"/>
  <text class="mono" x="272" y="168" font-size="9.5" fill="#90b4ff">with · diff</text>
  <!-- control edge (after: success) assess → notify -->
  <path d="M556 210 C 592 210, 600 246, 634 246" fill="none" stroke="#9aa0a6" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text class="mono" x="566" y="234" font-size="9.5" fill="#9aa0a6" fill-opacity="0.8">after · success</text>

  <!-- ═ card 1 · fetch (exec ▷) · settled ✓ ═ -->
  <g>
    <rect x="86" y="118" width="172" height="72" rx="12" fill="#1c1d21" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="98" y="130" width="22" height="22" rx="6" fill="#ff7a3c" fill-opacity="0.16" stroke="#ff7a3c" stroke-opacity="0.6"/>
    <text class="mono" x="104" y="146" font-size="12" fill="#ff9a6f">▷</text>
    <text class="mono" x="130" y="146" font-size="12.5" fill="#e8e8e8">fetch</text>
    <circle cx="238" cy="141" r="4.5" fill="#89d185"/>
    <text class="mono" x="98" y="170" font-size="10" fill="#bbb" fill-opacity="0.82">git diff --stat</text>
    <text class="mono" x="98" y="184" font-size="9.5" fill="#89d185">✓ 0.2s</text>
  </g>

  <!-- ═ card 2 · assess (infer ◇) · running ring ═ -->
  <g>
    <rect x="352" y="162" width="204" height="86" rx="12" fill="#1c1d21" stroke="#5b8cff" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="364" y="174" width="22" height="22" rx="6" fill="#5b8cff" fill-opacity="0.16" stroke="#5b8cff" stroke-opacity="0.6"/>
    <text class="mono" x="370" y="190" font-size="12" fill="#90b4ff">◇</text>
    <text class="mono" x="396" y="190" font-size="12.5" fill="#e8e8e8">assess</text>
    <!-- the running ring (two arcs, verb-hued) -->
    <circle cx="536" cy="185" r="7" fill="none" stroke="#5b8cff" stroke-opacity="0.2" stroke-width="2"/>
    <path d="M536 178 a7 7 0 0 1 6.1 3.5" fill="none" stroke="#5b8cff" stroke-width="2" stroke-linecap="round"/>
    <path d="M536 192 a7 7 0 0 1 -6.1 -3.5" fill="none" stroke="#5b8cff" stroke-width="2" stroke-linecap="round"/>
    <text class="mono" x="364" y="214" font-size="10" fill="#90b4ff">ollama/llama3.2</text>
    <text class="mono" x="364" y="230" font-size="10" fill="#bbb" fill-opacity="0.82">Review: ${{ with.diff }}</text>
  </g>

  <!-- ═ card 3 · notify (invoke ◆) · pending ═ -->
  <g>
    <rect x="634" y="214" width="130" height="64" rx="12" fill="#1c1d21" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="644" y="224" width="22" height="22" rx="6" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text class="mono" x="650" y="240" font-size="12" fill="#22d3ee">◆</text>
    <text class="mono" x="674" y="240" font-size="12.5" fill="#e8e8e8">notify</text>
    <circle cx="748" cy="235" r="3.5" fill="#9aa0a6" fill-opacity="0.6"/>
    <text class="mono" x="644" y="264" font-size="9.5" fill="#9aa0a6">nika:fetch</text>
  </g>

  <!-- ═ the lens deck (one graph · five lenses · one key each) ═ -->
  <g>
    <text class="mono" x="44" y="368" font-size="10" fill="#9aa0a6" fill-opacity="0.9" letter-spacing="0.08em">LENSES</text>
    <g class="mono" font-size="10.5">
      <rect x="104" y="354" width="20" height="18" rx="4" fill="#1c1d21" stroke="#ffffff" stroke-opacity="0.14"/><text x="110" y="367" fill="#ccc">X</text>
      <rect x="130" y="354" width="20" height="18" rx="4" fill="#1c1d21" stroke="#ffffff" stroke-opacity="0.14"/><text x="136" y="367" fill="#ccc">T</text>
      <rect x="156" y="354" width="20" height="18" rx="4" fill="#1c1d21" stroke="#ffffff" stroke-opacity="0.14"/><text x="162" y="367" fill="#ccc">P</text>
      <rect x="182" y="354" width="20" height="18" rx="4" fill="#1c1d21" stroke="#ffffff" stroke-opacity="0.14"/><text x="188" y="367" fill="#ccc">D</text>
      <rect x="208" y="354" width="20" height="18" rx="4" fill="#1c1d21" stroke="#ffffff" stroke-opacity="0.14"/><text x="214" y="367" fill="#ccc">H</text>
    </g>
    <text class="mono" x="240" y="367" font-size="9.5" fill="#9aa0a6" fill-opacity="0.75">what-if · timeline · audit · dataflow · heat</text>
  </g>

  <!-- caption -->
  <text class="cap" x="24" y="424" font-size="12">The plan as a graph · a <tspan class="mono">with:</tspan> binding IS a data edge · <tspan class="mono">after:</tspan> carries its predicate · <tspan class="mono">?</tspan> teaches every gesture</text>
</svg>
