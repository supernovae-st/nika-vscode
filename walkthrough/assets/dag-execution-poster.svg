<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The run executing through the DAG: chips landing green, one card live with the verb ring, the omnibar reads mock/echo deterministic zero keys, the hash-chained trace line below">
  <!-- Authored poster (the anti-rot law · pair of canvas-poster.svg):
       brand register inside the viewport (SSOT hues), theme ink outside. -->
  <style>
    .cap  { font-family: var(--vscode-font-family, system-ui, sans-serif); fill: var(--vscode-descriptionForeground, #999); }
    .mono { font-family: var(--vscode-editor-font-family, 'SF Mono', Menlo, Consolas, monospace); }
  </style>

  <!-- The pool -->
  <rect x="24" y="20" width="752" height="380" rx="10" fill="#0d0d0e"/>
  <rect x="24" y="20" width="752" height="380" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
  <g stroke="#ffffff" stroke-opacity="0.055" stroke-width="1">
    <path d="M150 90 h8 M154 86 v8"/><path d="M420 70 h8 M424 66 v8"/><path d="M640 120 h8 M644 116 v8"/>
    <path d="M110 280 h8 M114 276 v8"/><path d="M520 320 h8 M524 316 v8"/><path d="M710 250 h8 M714 246 v8"/>
  </g>

  <!-- status pill: run live -->
  <rect x="44" y="38" width="210" height="28" rx="14" fill="#1c1d21" stroke="#ffffff" stroke-opacity="0.09"/>
  <circle cx="62" cy="52" r="4" fill="#3794ff"/>
  <text class="mono" x="74" y="56" font-size="11.5" fill="#ccc">running · wave 2 of 2</text>

  <!-- wires -->
  <path d="M250 156 C 292 156, 302 200, 344 200" fill="none" stroke="#5b8cff" stroke-opacity="0.85" stroke-width="1.6"/>
  <path d="M552 214 C 588 214, 596 250, 630 250" fill="none" stroke="#9aa0a6" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="5 4"/>

  <!-- card 1 · fetch ▷ settled -->
  <g>
    <rect x="80" y="122" width="170" height="72" rx="12" fill="#1c1d21" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="92" y="134" width="22" height="22" rx="6" fill="#ff7a3c" fill-opacity="0.16" stroke="#ff7a3c" stroke-opacity="0.6"/>
    <text class="mono" x="98" y="150" font-size="12" fill="#ff9a6f">▷</text>
    <text class="mono" x="124" y="150" font-size="12.5" fill="#e8e8e8">fetch</text>
    <circle cx="230" cy="145" r="4.5" fill="#89d185"/>
    <text class="mono" x="92" y="174" font-size="9.5" fill="#89d185">✓ 0.2s</text>
  </g>

  <!-- card 2 · assess ◇ settled with cost -->
  <g>
    <rect x="344" y="166" width="200" height="82" rx="12" fill="#1c1d21" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="356" y="178" width="22" height="22" rx="6" fill="#5b8cff" fill-opacity="0.16" stroke="#5b8cff" stroke-opacity="0.6"/>
    <text class="mono" x="362" y="194" font-size="12" fill="#90b4ff">◇</text>
    <text class="mono" x="388" y="194" font-size="12.5" fill="#e8e8e8">assess</text>
    <circle cx="524" cy="189" r="4.5" fill="#89d185"/>
    <text class="mono" x="356" y="218" font-size="10" fill="#90b4ff">mock/echo</text>
    <text class="mono" x="356" y="234" font-size="9.5" fill="#89d185">✓ 1.1s · $0</text>
  </g>

  <!-- card 3 · notify ◆ RUNNING ring -->
  <g>
    <rect x="630" y="218" width="132" height="66" rx="12" fill="#1c1d21" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="640" y="228" width="22" height="22" rx="6" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text class="mono" x="646" y="244" font-size="12" fill="#22d3ee">◆</text>
    <text class="mono" x="670" y="244" font-size="12.5" fill="#e8e8e8">notify</text>
    <circle cx="746" cy="239" r="7" fill="none" stroke="#22d3ee" stroke-opacity="0.2" stroke-width="2"/>
    <path d="M746 232 a7 7 0 0 1 6.1 3.5" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
    <path d="M746 246 a7 7 0 0 1 -6.1 -3.5" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
    <text class="mono" x="640" y="270" font-size="9.5" fill="#22d3ee" fill-opacity="0.9">running…</text>
  </g>

  <!-- ═ the omnibar (zero keys made loud) ═ -->
  <g>
    <rect x="200" y="330" width="400" height="36" rx="18" fill="#1c1d21" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="212" y="337" width="56" height="22" rx="11" fill="#5b8cff" fill-opacity="0.9"/>
    <text class="mono" x="224" y="352" font-size="11" fill="#0d0d0e">▶ Run</text>
    <text class="mono" x="284" y="352" font-size="10.5" fill="#ccc">mock/echo</text>
    <text class="mono" x="362" y="352" font-size="10.5" fill="#9aa0a6">deterministic · $0 · zero keys</text>
    <!-- progress fill -->
    <rect x="212" y="360" width="376" height="2" rx="1" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="212" y="360" width="250" height="2" rx="1" fill="#5b8cff"/>
  </g>

  <!-- caption: the trace line -->
  <text class="cap" x="24" y="424" font-size="12"><tspan class="mono">trace</tspan> · 12 events · hash-chained <tspan class="mono">chain 6e5471…</tspan> · replay it later, prove it always</text>
</svg>
